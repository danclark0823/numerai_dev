name: recent_ridge_resid_a1
hypothesis: >
  Ridge (alpha=1) on target_ender_60 residualized vs both benchmarks, trained on every
  era of train + validation up to the holdout embargo, adds MMC beyond dc_tyndal,
  alone or blended 50/50 with it.
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  residualize_against: [v53_lgbm_ender60, v53_lgbm_ender20]
  era_stride: 1
  include_validation: true
  stream: true
validation:
  holdout_eras: 52
model:
  type: ridge
  params:
    alpha: 1
