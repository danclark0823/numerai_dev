# SHELVED research baseline; retained unchanged for reproducibility.
# Ridge + pairwise FM residuals and 10%/25% blends failed across-window screening.
# Positive MMC in the latest 30 eras did not repeat as contribution in older windows.
# See docs/wenek.md for results and the simplification follow-up; never deployed.
name: dc_wenek_1024_v1
seed: 42
data:
  version: v5.3
  target: target_ender_60
  feature_set: medium
  feature_limit: 128
  train_rows_per_era: 1024
  train_stride: 4
holdout_eras: 52
test_starts: [850, 1000, 1133]
test_eras: 30
ridge_alpha: 10
crossfit:
  min_train_eras: 40
  block_eras: 32
factorization_machine:
  rank: 8
  epochs: 8
  batch_size: 1024
  learning_rate: 0.003
  penalty: 0.01
teacher_trees: 80
