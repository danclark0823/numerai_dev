name: final_ender60
hypothesis: >
  Production fit of recent_ender60 (settings frozen after holdout look #2) on every
  resolved era of train + validation, including the holdout. Not scored.
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  era_stride: 1
  include_validation: all   # every resolved era incl. holdout; unscored production fit
  stream: true
validation:
  holdout_eras: 52
model:
  type: lgbm
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.1
    random_state: 42
    verbose: -1
