name: lgbm_all_bag4
hypothesis: >
  Averaging four models trained on disjoint every-4th-era subsets (all training
  data, constant memory) beats a single every-4th-era model.
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  era_stride: 4
  era_offsets: [0, 1, 2, 3]   # 4 models, one per era quarter, averaged
validation:
  holdout_eras: 52    # last ~1 year of resolved eras, locked; meta model covers these
model:
  type: lgbm
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.1
    random_state: 42
    verbose: -1
