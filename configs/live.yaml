# Live tournament models. Each Numerai model name maps to the validated
# experiment artifacts whose predictions it submits.
version: v5.3
feature_set: all          # features the member models were trained on

models:
  lgbm_bag4:
    description: >
      CORR-focused. LightGBM (all features, target_ender_60) trained on every
      resolved era of train + validation (final_ender60). Same settings as
      recent_ender60: holdout CORR 0.018, MMC 0.0069. (Name predates the
      switch from 4 era-bagged train-only models; see docs/results.md.)
    members: [final_ender60]
    neutralize: null

  dc_resid_ensemble:
    description: >
      Diversification-focused. Equal-weight gaussianized average of a model
      trained on target_ender_60 residualized against Numerai's benchmark, and a
      model trained on target_teager2b_60; then 50% neutralized against the
      medium feature set. Both trained on all eras up to the holdout embargo.
      Holdout CORR 0.0205, MMC 0.0099.
    members: [recent_resid_bench, recent_teager2b_60]
    neutralize:
      feature_set: medium
      proportion: 0.5

  dc_tyndal:
    description: >
      Experimental diversifier (Spellmonger war-mage series). LightGBM, all
      features, trained on target_ender_60 residualized per era against both
      Numerai benchmarks (v53_lgbm_ender60 and _ender20), on all eras up to the
      holdout embargo (recent_resid_both). Holdout CORR 0.0190, MMC 0.0109,
      MMC positive in 92% of holdout eras; corr with meta model 0.31.
    members: [recent_resid_both]
    neutralize: null

  dc_rondal:
    description: >
      Independent diversifier (Spellmonger war-mage series). Ridge regression
      (alpha=10), all features, trained on target_ender_60 residualized per era
      against both Numerai benchmarks, on every resolved era (final_ridge_resid_a10).
      Same settings as recent_ridge_resid_a10: holdout CORR 0.0199, MMC 0.0148,
      MMC positive in 52/52 holdout eras; corr with meta model 0.13.
    members: [final_ridge_resid_a10]
    neutralize: null
