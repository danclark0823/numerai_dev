name: ridge_resid_bench
hypothesis: >
  Ridge on target_ender_60 residualized against both benchmarks combines a
  different model family with a target the benchmark doesn't explain.
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  residualize_against: [v53_lgbm_ender60, v53_lgbm_ender20]
  era_stride: 4
validation:
  holdout_eras: 52
model:
  type: ridge
  params:
    alpha: 10
