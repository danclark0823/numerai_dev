name: lgbm_resid_both
hypothesis: >
  Residualizing target_ender_60 against both benchmarks (20 and 60 day) raises
  BMC beyond residualizing against the 60-day benchmark alone (0.0048).
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  residualize_against: [v53_lgbm_ender60, v53_lgbm_ender20]
  era_stride: 4
validation:
  holdout_eras: 52
model:
  type: lgbm
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.1
    random_state: 42
    verbose: -1
