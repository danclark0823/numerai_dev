name: lgbm_all_stride4
hypothesis: >
  Using all 3555 features instead of medium (780) raises dev CORR, holding the
  example-model LightGBM settings fixed.
data:
  version: v5.3
  feature_set: all
  target: target_ender_60
  era_stride: 4
validation:
  holdout_eras: 52    # last ~1 year of resolved eras, locked; meta model covers these
model:
  type: lgbm
  params:
    n_estimators: 2000
    learning_rate: 0.01
    max_depth: 5
    num_leaves: 31
    colsample_bytree: 0.1
    random_state: 42
    verbose: -1
