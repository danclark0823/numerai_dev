[project]
name = "numerai-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "polars",
    "lightgbm",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "numerapi",
    "numerai-tools",
    "joblib",
    "threadpoolctl",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
